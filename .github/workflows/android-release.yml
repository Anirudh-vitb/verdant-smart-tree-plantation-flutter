name: Android release APK

# Builds the release APK on a clean machine with the exact toolchain the
# project needs (Flutter 3.47.7, NDK 28.2.13676358, Android SDK 36) and
# uploads it as a downloadable artifact.
on:
  push:
    branches: [main, claude/brave-shannon-k43pgi]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 28.2.13676358
      PLATFORM: android-36
      BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable

      - name: Inspect Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version || true
          echo "Installed NDKs:"; ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          echo "Flutter's required NDK:"
          grep -n 'val ndkVersion' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"

      - name: Install SDK platform, build-tools and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes 2>/dev/null || true) | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" "platform-tools"

      - name: Verify installed packages from files, not exit codes
        run: |
          set -e
          grep 'Pkg.Revision' "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -f "$ANDROID_HOME/platforms/$PLATFORM/android.jar"
          grep 'Pkg.Revision' "$ANDROID_HOME/build-tools/$BUILD_TOOLS/source.properties"
          ls "$ANDROID_HOME/licenses"

      - name: Flutter doctor
        run: flutter doctor -v

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|uses-permission|native-code"
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)|Verified"
          unzip -l "$APK" | grep -E "lib/.*\.so$"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Runs the same repair-and-build script a Windows developer uses, under
  # Windows PowerShell 5.1, to prove it works on a real Windows toolchain.
  windows-script:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable

      - name: Diagnose sdkmanager argument handling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $sdk = $env:ANDROID_HOME
          $mgr = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          Write-Host "ANDROID_HOME=$sdk"
          Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Name
          Get-ChildItem (Join-Path $sdk 'ndk') -Name
          Write-Host '--- 1. Original form, as run from PowerShell (small package) ---'
          & $mgr "--sdk_root=$sdk" "--install=sources;android-36" 2>&1 | Select-Object -Last 15
          Write-Host "exit=$LASTEXITCODE  installed=$(Test-Path (Join-Path $sdk 'sources\android-36\source.properties'))"
          Write-Host '--- 2. Package id kept in quotes for cmd.exe ---'
          $p = Start-Process cmd.exe -ArgumentList ('/d /c ""' + $mgr + '" "--sdk_root=' + $sdk + '" "sources;android-36""') -NoNewWindow -Wait -PassThru
          Write-Host "exit=$($p.ExitCode)  installed=$(Test-Path (Join-Path $sdk 'sources\android-36\source.properties'))"

      - name: Run scripts/build-android-release.ps1
        shell: powershell
        run: |
          .\scripts\build-android-release.ps1 -FlutterBat "$env:FLUTTER_ROOT\bin\flutter.bat" -SdkRoot $env:ANDROID_HOME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build\app\outputs\flutter-apk\app-release.apk)) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-log
          path: build-repair-logs/
